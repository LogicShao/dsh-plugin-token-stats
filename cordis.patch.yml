# dsh-plugin-token-stats bundle layer.
#
# 只挂载本插件；统计所需的服务（session-persistence / sessions / connection / tools）
# 全部从宿主按需读取，缺少任何一个时插件降级（读不到数据就显示空态），不会拖垮启动。
#
# 想改价格表 / 币种 / 缓存 TTL：不要改本文件，在 profile 的 cordis.patch.yml 里
# 按 id `token-stats` 覆盖 config（深层对象会按 Cordis 的字段合并规则覆盖）。
- insert:
    - id: token-stats
      name: 'dsh-plugin-token-stats'
      config:
        # 成本估算单价：每 100 万 token 的美元价。
        # 键可以是 "provider/model"（精确）或 "model"（跨 provider 兜底）；
        # 未命中的模型按 0 计价，并在响应里列进 prices.unmatchedModels。
        #
        # 两种价格形状都支持：
        #   平铺：{ input, output, cacheRead, cacheWrite }  —— 单一价（opencode-go 订阅通道）
        #   峰谷：{ peak: {...}, offPeak: {...} }           —— 官方 DeepSeek API 峰/闲双价
        #
        # 计费字段映射（官方口径）：
        #   input      = 缓存未命中的输入 token
        #   cacheRead  = 缓存命中的输入 token
        #   output     = 输出 token
        #   cacheWrite = 官方无此项，恒为 0
        #
        # 峰时定义（官方价目页，2026-10-28 核对）：UTC 周一至周五 01:00-04:00、06:00-10:00，
        # 即北京时间 09:00-12:00、14:00-18:00；其余时段与周末为闲时。
        # 北京时间固定 UTC+8、无夏令时。
        # 已知偏差：中国法定节假日官方按闲时计费，本实现没有节假日日历，
        # 节假日白天会按峰时估算（偏保守，不取平均价）。
        #
        # 价格来源：https://api-docs.deepseek.com/quick_start/pricing （USD 表，2026-10-28 核对）
        prices:
          # 官方 DeepSeek API：deepseek-flash = V4.1-Flash-1017
          deepseek-account/deepseek-flash:
            peak:
              input: 0.30
              cacheRead: 0.006
              output: 1.2
              cacheWrite: 0
            offPeak:
              input: 0.15
              cacheRead: 0.003
              output: 0.6
              cacheWrite: 0
          deepseek-account/deepseek-v4-pro:
            peak:
              input: 1.32
              cacheRead: 0.044
              output: 3.96
              cacheWrite: 0
            offPeak:
              input: 0.66
              cacheRead: 0.022
              output: 1.98
              cacheWrite: 0
          # 官方直连通道，与 deepseek-account 同价。
          deepseek-official/deepseek-flash:
            peak:
              input: 0.30
              cacheRead: 0.006
              output: 1.2
              cacheWrite: 0
            offPeak:
              input: 0.15
              cacheRead: 0.003
              output: 0.6
              cacheWrite: 0
          # legacy 模型名：官方文档说明 deepseek-v4-flash 按 Flash 价计费。
          deepseek-official/deepseek-v4-flash:
            peak:
              input: 0.30
              cacheRead: 0.006
              output: 1.2
              cacheWrite: 0
            offPeak:
              input: 0.15
              cacheRead: 0.003
              output: 0.6
              cacheWrite: 0
          # 以下两条是 opencode-go 订阅通道，价格是订阅侧折算的固定单价，保持不变。
          opencode-go/deepseek-v4.1-flash:
            input: 0.15
            output: 0.6
            cacheRead: 0.015
            cacheWrite: 0.15
          opencode-go/deepseek-v4-flash:
            input: 0.1
            output: 0.4
            cacheRead: 0.01
            cacheWrite: 0.1
        currency: USD
        usdToCny: 7.1
        # 一次刷新里最多并发读几个 session 日志（数据量大时保护磁盘/内存）。
        readConcurrency: 3
        # 两次自动刷新之间的最小间隔；UI 轮询也受它兜底。
        refreshIntervalMs: 15000
        # 首次加载时是否在后台立刻全量建索引（false 则等第一次查询再建）。
        refreshOnStart: true
